name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '8,38 * * * *' # every 30 min: TSM's auction house files (TSM updates them about every 3 hours), its daily region file, new WoW Forever builds from wago.tools
  workflow_dispatch:

permissions:
  contents: write # commits the addon's game data file when the game build changes
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Download game data from wago.tools
        run: npm run data

      - name: Addon game data (committed when it changes)
        run: |
          node scripts/build-addon-data.mjs
          cd ..
          git add addon/FlipExport/Data/GameData.lua
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Addon game data: $(sed -n 's/^D.build = \"\(.*\)\"$/\1/p' addon/FlipExport/Data/GameData.lua)"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi

      - name: Download TradeSkillMaster sales data (optional)
        run: node scripts/fetch-tsm.mjs
        continue-on-error: true

      - name: Package the addon for download
        run: cd ../addon && zip -qr ../web/public/FlipExport.zip FlipExport

      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
